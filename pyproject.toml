[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creditrisk"
version = "0.1.0"
description = "Retail Credit Risk Modelling System"
requires-python = ">=3.11"
dependencies = [
    "google-generativeai>=0.8.0",
    "matplotlib>=3.11.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "pypdf>=5.0.0",
    "pytest>=8.0.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "sentence-transformers>=3.0.0",
    "statsmodels>=0.14.0"
]

[tool.setuptools.packages.find]
where = ["src"]
